<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>English Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout concept: a metro line runs from A2 to C2 through the whole app — each level is a station
   with its own colour. Shell = sticky header, one reading column, bottom tab bar on phones. */
:root {
  --paper: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eaedf4;
  --ink: #151a30;
  --ink-2: #545b77;
  --line: #d9dde9;
  --accent: #2343d6;
  --accent-ink: #ffffff;
  --accent-soft: #e2e7fc;
  --good: #137649;
  --good-soft: #def2e7;
  --bad: #b3322b;
  --bad-soft: #fbe6e4;
  --warn: #8f5a0c;
  --warn-soft: #faefd9;
  --a2: #13895e;
  --b1: #0a7fa2;
  --b2: #5a42c9;
  --c1: #b5700b;
  --c2: #b92c42;
  --shadow: 0 1px 2px rgba(21, 26, 48, .05), 0 8px 24px rgba(21, 26, 48, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r-s: 6px;
  --r-m: 12px;
  --r-l: 20px;
  --col: 780px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1020; --surface: #151a2d; --surface-2: #1c2238; --ink: #e7eaf6; --ink-2: #a1a7c2; --line: #2a3150;
    --accent: #8396ff; --accent-ink: #0d1020; --accent-soft: #222a50;
    --good: #46cf93; --good-soft: #15322a; --bad: #f2817a; --bad-soft: #3a1d23; --warn: #f0b04f; --warn-soft: #382a14;
    --a2: #3fcf95; --b1: #3cb6dc; --b2: #9a87ff; --c1: #efab45; --c2: #f26b80;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1020; --surface: #151a2d; --surface-2: #1c2238; --ink: #e7eaf6; --ink-2: #a1a7c2; --line: #2a3150;
  --accent: #8396ff; --accent-ink: #0d1020; --accent-soft: #222a50;
  --good: #46cf93; --good-soft: #15322a; --bad: #f2817a; --bad-soft: #3a1d23; --warn: #f0b04f; --warn-soft: #382a14;
  --a2: #3fcf95; --b1: #3cb6dc; --b2: #9a87ff; --c1: #efab45; --c2: #f26b80;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.75rem, 1.2rem + 2.2vw, 2.5rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.08rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: -0.2em; }
.muted { color: var(--ink-2); }
.small { font-size: .88rem; }
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 700; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
.brand-line { display: inline-flex; align-items: center; position: relative; gap: 3px; }
.brand-line::before { content: ""; position: absolute; left: 2px; right: 2px; top: 50%; height: 2px; background: var(--line); transform: translateY(-50%); }
.brand-line i { position: relative; width: 8px; height: 8px; border-radius: 50%; display: block; }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav a { display: flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: var(--r-s); text-decoration: none; color: var(--ink-2); font-weight: 700; font-size: .93rem; position: relative; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); font-size: .7rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
.stats { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.stat { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); font-weight: 700; font-size: .88rem; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); text-decoration: none; }
.stat.flame { color: var(--c1); }
.stat.flame.off { color: var(--ink-2); }
a.stat:hover { background: var(--accent-soft); color: var(--accent); }
.wrap { max-width: var(--col); margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
.wrap.wide { max-width: 1040px; }
.wrap > *, .sec > *, .ref-body > *, .exbox > *, .coach > *, .flash > *, .lesson-head > *, .level-body > *, .card > * { min-width: 0; }
.tabbar { display: none; }
@media (max-width: 1280px) { .plan-txt, .brand-name { display: none; } }
@media (max-width: 1040px) {
  .nav { display: none; }
  .brand-name { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 7px; font-size: .68rem; font-weight: 700; color: var(--ink-2); text-decoration: none; position: relative; }
  .tabbar a .ic { width: 22px; height: 22px; }
  .tabbar a[aria-current="page"] { color: var(--accent); }
  .tabbar .badge { position: absolute; top: 3px; left: 54%; }
  .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
}

/* ---------- generic components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 22px; box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); padding: 10px 18px; border-radius: 999px; font-weight: 700; text-decoration: none; font-size: .95rem; line-height: 1.2; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.small { padding: 7px 13px; font-size: .86rem; }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 6px 13px; border-radius: 999px; font-weight: 700; font-size: .86rem; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.lvl { display: inline-flex; align-items: center; justify-content: center; min-width: 2.4em; padding: 2px 8px; border-radius: var(--r-s); font-family: var(--f-mono); font-size: .78rem; font-weight: 500; color: #fff; background: var(--lv, var(--accent)); letter-spacing: .02em; }
:root[data-theme="dark"] .lvl { color: #0d1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .lvl { color: #0d1020; } }
.say { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); flex: none; padding: 0; }
.say:hover { color: var(--accent); border-color: var(--accent); }
.say.playing { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.no-audio .say, .no-audio .needs-audio { display: none !important; }
.tbl-wrap { position: relative; overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .93rem; }
.tbl th { text-align: left; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: none; }
.tbl td.en { font-weight: 700; }
.tbl td.ex { color: var(--ink-2); min-width: 220px; }
.tbl caption { caption-side: top; text-align: left; padding: 12px 12px 4px; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 1040px) { .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.empty { text-align: center; padding: 36px 20px; color: var(--ink-2); display: grid; gap: 12px; justify-items: center; }

/* ---------- metro line ---------- */
.metro { display: grid; grid-template-columns: repeat(5, 1fr); position: relative; padding-top: 4px; }
.metro .stop { position: relative; display: grid; justify-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.metro .stop::before { content: ""; position: absolute; top: 13px; left: -50%; width: 100%; height: 6px; background: var(--line); z-index: 0; }
.metro .stop:first-child::before { display: none; }
.metro .stop .fill { position: absolute; top: 13px; left: -50%; height: 6px; background: var(--lv); z-index: 1; width: var(--pp, 0%); max-width: 100%; }
.metro .stop:first-child .fill { display: none; }
.metro .dot { position: relative; z-index: 2; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); border: 6px solid var(--lv); display: grid; place-items: center; }
.metro .stop.here .dot { box-shadow: 0 0 0 5px color-mix(in srgb, var(--lv) 28%, transparent); }
.metro .stop.done .dot { background: var(--lv); }
.metro .code { font-family: var(--f-mono); font-weight: 500; font-size: .85rem; }
.metro .pct { font-size: .75rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* ---------- today ---------- */
.today-hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.today-hero .lead { margin-top: 8px; color: var(--ink-2); max-width: 46ch; }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .bg { stroke: var(--surface-2); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s; }
.ring.full .fg { stroke: var(--good); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring .lbl b { font-family: var(--f-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.ring .lbl span { font-size: .72rem; color: var(--ink-2); font-weight: 700; }
.mission ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.step { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); }
.step .num { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; background: var(--surface-2); color: var(--ink-2); }
.step.done { background: var(--good-soft); border-color: transparent; }
.step.done .num { background: var(--good); color: var(--surface); }
.step .what { min-width: 0; }
.step .what b { display: block; }
.step .what .muted { font-size: .88rem; }
@media (max-width: 520px) { .step { grid-template-columns: 36px 1fr; } .step .go { grid-column: 2; justify-self: start; } .today-hero { gap: 12px; } .ring { width: 84px; height: 84px; } .ring .lbl b { font-size: 1.2rem; } }
.mission-done { margin-top: 12px; font-weight: 700; color: var(--good); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.quote-en { font-family: var(--f-display); font-weight: 600; font-size: 1.35rem; line-height: 1.25; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 110px; margin-top: 8px; }
.week .bar { display: grid; gap: 6px; justify-items: center; align-self: stretch; grid-template-rows: 1fr auto; }
.week .col { width: 100%; max-width: 28px; background: var(--surface-2); border-radius: 6px; position: relative; overflow: hidden; align-self: stretch; }
.week .col i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); border-radius: 6px; }
.week .col.met i { background: var(--good); }
.week .d { font-size: .72rem; font-weight: 700; color: var(--ink-2); text-transform: uppercase; }
.week .bar.today .d { color: var(--ink); }
.welcome { border: 2px solid var(--accent); }

/* ---------- path ---------- */
.level-block { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--surface); overflow: hidden; }
.level-block > summary { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 18px 20px; }
.level-block > summary .big { font-family: var(--f-mono); font-size: 1.4rem; font-weight: 500; color: var(--lv); }
.level-block > summary .bar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.level-block > summary .bar i { display: block; height: 100%; background: var(--lv); }
.level-block > summary .chev { transition: transform .2s; color: var(--ink-2); }
.level-block[open] > summary .chev { transform: rotate(90deg); }
.level-body { padding: 4px 20px 20px; display: grid; gap: 18px; }
.module h3 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 6px; font-family: var(--f-body); font-weight: 700; }
.lrow { display: grid; grid-template-columns: 26px 1fr auto; gap: 12px; align-items: center; padding: 11px 6px; border-top: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.lrow:hover { background: var(--surface-2); }
.lrow .st { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.lrow .st.done { background: var(--lv); border-color: var(--lv); color: var(--surface); }
.lrow .st.redo { border-color: var(--warn); color: var(--warn); }
.lrow .st .ic { width: 14px; height: 14px; stroke-width: 3; }
.lrow .t { min-width: 0; }
.lrow .t b { display: block; font-weight: 700; }
.lrow .t span { font-size: .86rem; color: var(--ink-2); }
.lrow .meta { font-size: .8rem; color: var(--ink-2); text-align: right; white-space: nowrap; }
.tag-book { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); margin-top: 3px; }
.vchips { display: flex; flex-wrap: wrap; gap: 8px; }
.vchip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--r-s); border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-weight: 700; font-size: .88rem; }
.vchip.done { border-color: var(--lv); color: var(--lv); }

/* ---------- lesson ---------- */
.back { text-decoration: none; font-weight: 700; color: var(--ink-2); font-size: .92rem; display: inline-flex; align-items: center; gap: 6px; }
.back:hover { color: var(--accent); }
.lesson-head { display: grid; gap: 10px; }
.lesson-head .fr { font-size: 1.15rem; color: var(--ink-2); font-family: var(--f-display); font-weight: 600; }
.goal { padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); }
.jump { display: flex; gap: 6px; flex-wrap: wrap; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); z-index: 5; background: var(--paper); padding: 8px 0; }
@media (max-width: 600px) { .jump { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; } .jump::-webkit-scrollbar { display: none; } .plan-txt { display: none; } }
.jump button { white-space: nowrap; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .82rem; font-weight: 700; color: var(--ink-2); }
.jump button:hover { color: var(--accent); border-color: var(--accent); }
.sec { display: grid; gap: 14px; scroll-margin-top: 120px; }
.sec-title { display: flex; align-items: center; gap: 12px; }
.sec-title .n { width: 30px; height: 30px; border-radius: 50%; background: var(--lv); color: var(--surface); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: .95rem; flex: none; }
.prose { display: grid; gap: 12px; max-width: 68ch; }
.prose em, .uses em { font-style: normal; font-weight: 700; color: var(--accent); }
.formulas { border-radius: var(--r-m); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.formula { display: grid; grid-template-columns: minmax(110px, 160px) 1fr; border-bottom: 1px solid var(--line); }
.formula:last-child { border-bottom: none; }
.formula .k { padding: 12px 14px; background: var(--surface-2); font-weight: 700; font-size: .88rem; color: var(--ink-2); }
.formula .v { padding: 12px 14px; font-family: var(--f-mono); font-size: .9rem; min-width: 0; overflow-wrap: anywhere; }
.formula .v b { color: var(--lv); font-weight: 500; background: color-mix(in srgb, var(--lv) 12%, transparent); padding: 0 3px; border-radius: 3px; }
@media (max-width: 520px) { .formula { grid-template-columns: 1fr; } .formula .k { padding-bottom: 6px; } }
.book { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: start; padding: 14px 16px; border-radius: var(--r-m); background: var(--warn-soft); color: var(--ink); }
.book .ic { color: var(--warn); width: 26px; height: 26px; }
.book b { color: var(--warn); }
.uses { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.use { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; display: grid; gap: 8px; align-content: start; }
.use h3 { font-size: 1rem; }

window.HUB.extras.speaking = [
  { level: "A2", en: "I think this is the third time this month.", focus: "Le son th : place le bout de la langue entre les dents. Il est sourd dans think, third, month (on souffle) et sonore dans this, the (ça vibre)." },
  { level: "A2", en: "His house is on the hill behind the hospital.", focus: "Le h est aspiré : souffle légèrement, comme pour faire de la buée sur une vitre. Ne dis pas « is ouse » mais « his house »." },
  { level: "A2", en: "Please sit in this seat, not that one.", focus: "Voyelle courte et voyelle longue : le i de sit et this est bref et relâché, le ee de seat est long et tiré. Les confondre change le mot." },
  { level: "A2", en: "I walked to school and played football after class.", focus: "Terminaison -ed : après k, p, s, ch, sh, f, elle se prononce /t/ (walked = « wokt »), après un son sonore /d/ (played). Ne rajoute pas de « é »." },
  { level: "A2", en: "What would you like to drink?", focus: "Le w se prononce comme dans « oui ». Dans would, le l est muet : on dit « woud »." },
  { level: "A2", en: "Could you speak a little more slowly, please?", focus: "Could : le l est muet. Slowly : la diphtongue « ou » glisse, on ne dit pas « slo-li » à la française." },
  { level: "A2", en: "I'm hungry. Are you hungry too?", focus: "Le h de hungry est aspiré et le u se prononce comme un « a » bref (« hangri »). Dans une question fermée, la voix monte à la fin." },
  { level: "A2", en: "Where are you from? I'm from France.", focus: "Dans une question avec where, what ou how, la voix descend à la fin. En anglais britannique, le a de France est long et ouvert (« fraans »)." },
  { level: "A2", en: "She sells sea shells on the sea shore.", focus: "Distingue /s/ (sells, sea) et /ʃ/ (she, shells, shore), qui ressemble au « ch » français. Commence lentement, puis accélère." },
  { level: "A2", en: "I'd like a cup of tea and a piece of cake.", focus: "Les petits mots sont réduits : a et of se prononcent avec un son très bref, le schwa (« a cup ə tea »). Seuls les mots importants sont accentués." },
  { level: "B1", en: "I've been working here for three years.", focus: "Les contractions comme I've sont naturelles à l'oral. For devient faible : « fə three years »." },
  { level: "B1", en: "The photographer took a photograph for the photographic exhibition.", focus: "L'accent tonique se déplace : PHOtograph, phoTOgrapher, photoGRAPHic. Repère la syllabe forte de chaque mot." },
  { level: "B1", en: "I wanted to visit the museum, but it was closed.", focus: "Après t ou d, -ed se prononce /ɪd/ : wanted = « won-tid ». Mais closed se dit en une syllabe (« klouzd »)." },
  { level: "B1", en: "Turn it off and on again.", focus: "Liaison consonne-voyelle : les mots s'enchaînent comme un seul bloc, « tur-ni-to-fan-do-nə-gain »." },
  { level: "B1", en: "Would you mind opening the window?", focus: "Would you se prononce souvent « wou-djou » : le d et le y fusionnent. Mind se dit « maïnd »." },
  { level: "B1", en: "The weather has been awful this year.", focus: "Weather et whether se prononcent pareil. Year commence par le son « y » de « yeux » : ne dis pas ear (l'oreille)." },
  { level: "B1", en: "I can come, but I can't stay long.", focus: "Can est faible (« kən ») dans une phrase affirmative ; can't est fort et long en anglais britannique (« kaant »). C'est souvent la seule différence audible." },
  { level: "B1", en: "The restaurant was comfortable and the vegetables were delicious.", focus: "Syllabes avalées : restaurant (« res-tront »), comfortable (« kumf-tə-bl »), vegetables (« vej-tə-blz »)." },
  { level: "B1", en: "Do you know what I mean?", focus: "Le k de know est muet. Seuls know et mean sont accentués ; les autres mots passent très vite." },
  { level: "B1", en: "Their friends are over there, and they're waiting.", focus: "Their, there et they're se prononcent exactement de la même façon. Le th est sonore : la langue vibre entre les dents." },
  { level: "B2", en: "I should have told you earlier.", focus: "Should have se réduit à « shoul-də » à l'oral : on n'entend presque pas have. Earlier commence par un « eu » long." },
  { level: "B2", en: "The record shows that they record every meeting.", focus: "Un même mot change d'accent selon sa nature : a REcord (nom), to reCORD (verbe). Même chose pour PREsent / preSENT, OBject / obJECT." },
  { level: "B2", en: "Honestly, it was an honour to spend an hour with her.", focus: "Le h est muet dans honest, honour, hour et heir. C'est pour cela qu'on dit an honour et an hour." },
  { level: "B2", en: "Thirteen or thirty? I said thirteen.", focus: "thirTEEN est accentué à la fin, THIRty au début. Indispensable pour les nombres, les prix et les horaires." },
  { level: "B2", en: "Let me get a bottle of water.", focus: "En américain, le t entre deux voyelles devient un « d » rapide (« bodl of wader ») ; en britannique, il peut devenir un coup de glotte (« bo'l »)." },
  { level: "B2", en: "I didn't say she stole the money.", focus: "L'accent de phrase change le sens : I didn't say SHE stole it signifie que c'est quelqu'un d'autre. Essaie d'accentuer chaque mot à tour de rôle." },
  { level: "B2", en: "Rural areas are rarely reached by regular buses.", focus: "Le r anglais : la langue ne touche rien, recule légèrement et les lèvres s'arrondissent. Ni r roulé, ni r de gorge." },
  { level: "B2", en: "Wednesday is the worst day of the week for work.", focus: "Le son de worst et work est un « eu » long, bouche détendue. Wednesday se dit « wenz-dei » : le premier d est muet." },
  { level: "B2", en: "I'm not sure whether the answer is clear.", focus: "Les diphtongues glissent d'un son à l'autre : clear (« kli-ə »), sure (« shor » ou « shou-ə »). Ne les aplatis pas." },
  { level: "B2", en: "Could you pass me the salt and pepper, please?", focus: "And se réduit à « ən » : « salt ən pepper ». Le rythme anglais repose sur les syllabes accentuées, pas sur toutes les syllabes comme en français." },
  { level: "C1", en: "It's not what you said, it's the way you said it.", focus: "Accent contrastif : appuie sur what et way pour opposer les deux idées. L'intonation porte le message." },
  { level: "C1", en: "Particularly in rural areas, the infrastructure is deteriorating.", focus: "Mots longs : parTIcularly, INfrastructure, deTEriorating. Repère la syllabe forte et réduis les autres." },
  { level: "C1", en: "Oh, you've finished it already? Well, that was quick!", focus: "Surprise : la voix monte haut sur already puis redescend. Marque une petite pause après Well." },
  { level: "C1", en: "The data was thoroughly analysed throughout the year.", focus: "Thoroughly (« THU-rə-li ») et throughout (« thru-OUT ») enchaînent th sourd et r. Prends le temps de bien placer la langue." },
  { level: "C1", en: "I'd rather you didn't mention it to anyone.", focus: "I'd rather se dit « aïd RAA-thə ». Les formes faibles rendent la phrase fluide : you didn't devient « yə DID-nt »." },
  { level: "C1", en: "Asked whether she'd consider it, she simply laughed.", focus: "Groupes de consonnes en fin de mot : asked = « aaskt », laughed = « laaft ». Ne supprime pas le t final." },
  { level: "C1", en: "If I were you, I wouldn't worry about it.", focus: "Liaisons : wouldn't worry s'enchaîne, et about it devient « ə-bau-tit ». Le rythme reste régulier." },
  { level: "C1", en: "The committee's decision was controversial, to say the least.", focus: "coMMIttee, contro-VER-sial. To say the least se dit sur un ton descendant, légèrement ironique." },
  { level: "C1", en: "Clothes, months and sixths are hard to pronounce.", focus: "Groupes difficiles : clothes (souvent « klouz »), months (« manθs »), sixths (« siksθs »). Va lentement, puis accélère." },
  { level: "C1", en: "Isn't it lovely weather we're having?", focus: "Question rhétorique ou ironique : la voix descend à la fin, contrairement à une vraie question. Le contexte donne le ton." },
  { level: "C2", en: "I wouldn't say it was a disaster, exactly.", focus: "Euphémisme britannique : une intonation montante puis descendante sur exactly laisse entendre qu'on pense le contraire." },
  { level: "C2", en: "Well, that went well, didn't it?", focus: "Ironie : intonation plate, puis descendante sur didn't it. Une question-tag descendante attend un accord, ici moqueur." },
  { level: "C2", en: "She was the epitome of elegance, and utterly indefatigable.", focus: "Mots savants : epitome se dit « i-PI-tə-mi » (quatre syllabes), indefatigable « in-di-FA-ti-gə-bl ». Vérifie toujours l'accent des mots rares." },
  { level: "C2", en: "What I meant was that we ought to have been told.", focus: "Ought to have been se dit « AU-tə-əv-bin ». Les formes faibles s'enchaînent, seuls meant et told portent l'accent." },
  { level: "C2", en: "It's a question of choice rather than chance.", focus: "Rythme accentuel : question, choice et chance tombent à intervalles réguliers, le reste se compresse entre eux." },
  { level: "C2", en: "The colonel and the lieutenant drove to Leicester.", focus: "Pièges célèbres : colonel se dit « keu-nl », lieutenant « lef-TE-nənt » en britannique, Leicester « LES-tə »." },
  { level: "C2", en: "Hmm, I suppose you could put it that way.", focus: "Réserve polie : allonge le Hmm et fais monter puis descendre la voix sur suppose. Tu signales un léger désaccord sans le dire." },
  { level: "C2", en: "He didn't steal it; he borrowed it without asking.", focus: "Accent emphatique sur didn't, steal et borrowed pour corriger une affirmation. La phrase prend un ton défensif." },
  { level: "C2", en: "Gradually, almost unbelievably, the situation improved.", focus: "Adverbes détachés en début de phrase : courte pause après chaque virgule, intonation montante qui annonce la suite." },
  { level: "C2", en: "Mind you, it's not as if we hadn't been warned.", focus: "Mind you introduit une nuance : accentue MIND, marque une pause, puis accélère. Hadn't been warned se dit « HAD-nt bin WORND »." }
];

/* Browser speech recognition (Chrome, Edge, Safari) with the same interface as Claude's dictation:
   used only on the standalone website, where the Claude capability does not exist. */
function webMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  let rec = null, on = false, err = null;
  const h = { partial: [], final: [], state: [] };
  const emit = (k, v) => h[k].forEach(f => { try { f(v); } catch (e) { /* ignore */ } });
  return {
    onPartial: f => { h.partial.push(f); },
    onFinal: f => { h.final.push(f); },
    onState: f => { h.state.push(f); },
    active: () => on,
    start() {
      return new Promise((resolve, reject) => {
        try {
          err = null; rec = new SR();
          rec.lang = "en-GB"; rec.interimResults = true; rec.continuous = true; rec.maxAlternatives = 1;
          on = true; emit("state", { state: "starting" });
          rec.onstart = () => emit("state", { state: "listening" });
          rec.onresult = ev => {
            let interim = "";
            for (let i = ev.resultIndex; i < ev.results.length; i++) {
              const r = ev.results[i];
              if (r.isFinal) emit("final", { text: r[0].transcript + " " }); else interim += r[0].transcript;
            }
            emit("partial", { text: interim });
          };
          rec.onerror = ev => {
            err = (ev.error === "not-allowed" || ev.error === "service-not-allowed") ? "not_granted"
              : (ev.error === "no-speech" || ev.error === "aborted") ? "stopped" : "unavailable";
          };
          rec.onend = () => {
            on = false;
            emit("state", { state: "idle", reason: err || "stopped" });
            if (err && err !== "stopped") reject({ code: err }); else resolve();
          };
          rec.start();
        } catch (e) { on = false; reject({ code: "unavailable" }); }
      });
    },
    stop() { if (rec && on) { emit("state", { state: "finishing" }); try { rec.stop(); } catch (e) { /* ignore */ } } return Promise.resolve(); }
  };
}
const MIC_DENIED = STANDALONE

/* =========================================================================
   Word matching (dictation, pronunciation)
   ========================================================================= */
function matchWords(target, given) {
  const toks = String(target).split(/\s+/).filter(Boolean);
  const idx = [], a = [];
  toks.forEach((t, k) => { const n = norm(t); if (n) n.split(" ").forEach(w => { a.push(w); idx.push(k); }); });
  const b = norm(given).split(" ").filter(Boolean);
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hitW = new Array(m).fill(false);
  let i = 0, j = 0;
  while (i < m && j < n) { if (a[i] === b[j]) { hitW[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  const tokHit = toks.map(() => true);
  hitW.forEach((h, w) => { if (!h) tokHit[idx[w]] = false; });
  return { toks, tokHit, score: m ? dp[0][0] / Math.max(m, n) : 0 };
}

    + '<nav class="chips" aria-label="Sections du mémo">' + sections.map(s => '<button class="chip" data-act="jump" data-to="' + s[0] + '">' + s[1] + "</button>").join("") + "</nav>"
    + '<section class="sec" id="m-temps"><h2>Les temps en un coup d\'œil</h2>' + table(["Temps", "Forme", "Quand l'utiliser", "Exemple"], X.tenseTable || [], { cls: ["en", "", "", "ex"], say: 3 }) + "</section>"
    + '<section class="sec" id="m-cond"><h2>Les conditionnels</h2>' + table(["Type", "Structure", "Sens", "Exemple"], X.conditionalTable || [], { cls: ["en", "", "", "ex"], say: 3 }) + "</section>"
    + '<section class="sec" id="m-irr"><h2>Verbes irréguliers <span class="muted small" style="font-family:var(--f-body);font-weight:400">· ' + irr.length + ' verbes</span></h2><input class="field" id="irr-search" type="search" placeholder="Chercher un verbe (anglais ou français)" aria-label="Chercher un verbe" style="max-width:420px">'
    + table(["Base", "Prétérit", "Participe passé", "Français"], irr, { cls: ["en", "", "", "ex"], say: r => r[0] + ", " + r[1] + ", " + r[2], bodyId: "irr-body", rowAttr: r => ' data-q="' + esc(norm(r.join(" "))) + '"' }) + "</section>"
    + '<section class="sec" id="m-comp"><h2>Comparatifs et superlatifs</h2><p class="muted">Une syllabe : <b>-er / the -est</b>. Deux syllabes ou plus : <b>more / the most</b> (sauf celles en -y : happier). Les irréguliers sont à connaître par cœur.</p>'
    + table(["Adjectif", "Français", "Comparatif", "Superlatif", "Exemple"], X.comparativesAdj || [], { caption: "Adjectifs", cls: ["en", "", "", "", "ex"], say: 4 })
    + table(["Adverbe", "Français", "Comparatif", "Superlatif", "Exemple"], X.comparativesAdv || [], { caption: "Adverbes", cls: ["en", "", "", "", "ex"], say: 4 }) + "</section>"
    + '<section class="sec" id="m-pron"><h2>Pronoms</h2>' + table(["Personne", "Sujet", "Objet", "Adj. possessif", "Pronom possessif", "Réfléchi"], (X.pronounTable || []).map(r => r.map(c => c || "—")), { cls: ["", "en"] }) + '<p class="small muted">Attention : <em>his / her</em> s\'accorde avec le possesseur, pas avec l\'objet. Sa mère (à lui) = <b>his</b> mother ; sa mère (à elle) = <b>her</b> mother.</p></section>'
    + '<section class="sec" id="m-conn"><h2>Connecteurs</h2>' + table(["Connecteur", "Rôle", "Français", "Niveau", "Exemple"], (X.connectors || []).map(c => [c.en, c.role, c.fr, c.level, c.ex]), { cls: ["en", "", "", "", "ex"], say: 4 }) + "</section>";
};
function filterIrr(q) {
  const n = norm(q);
  $$("#irr-body tr").forEach(tr => { tr.hidden = !!n && !tr.dataset.q.includes(n); });
}

/* =========================================================================
   View: plan and settings
   ========================================================================= */
let resetAsk = false;
VIEWS.plan = function () {
  const s = S(), w = weeksLeft(), L = currentLevel();
  const hoursAt = { A2: 200, B1: 400, B2: 600, C1: 800, C2: 1100 };
  const toB2 = Math.max(0, hoursAt.B2 - hoursAt[L]), toC2 = Math.max(0, hoursAt.C2 - hoursAt[L]);
  const perDay = h => w ? (h / (w * 7)).toFixed(1).replace(".", ",") : "–";
  const lessonsDone = Object.keys(s.lessons).length;
  const methods = [
    ["Répétition espacée", "On retient bien mieux en revoyant une information à intervalles croissants qu'en la relisant d'un bloc. C'est le rôle de l'onglet Révisions : chaque carte revient demain, puis dans 2, 4, 8, 16 jours."],
    ["Rappel actif", "Chercher la réponse dans ta mémoire avant de la voir est plus efficace que relire. D'où les exercices à trous, les phrases à remettre dans l'ordre et les cartes à retourner."],
    ["Input compréhensible", "Tu progresses en écoutant et en lisant de l'anglais un peu au-dessus de ton niveau, où tu comprends l'essentiel. Les exemples audio, les dictées et l'immersion ci-dessous servent à ça."],
    ["Produire (output)", "Parler et écrire te montrent ce qui manque et fixent ce que tu sais. Prononciation, écriture corrigée et question au prof sont là pour ça."],
    ["Régularité", "Vingt à quarante minutes chaque jour valent mieux que trois heures le dimanche. La série de jours et la mission du jour t'y aident."],
    ["Erreurs utiles", "Chaque erreur faite en exercice revient en carte « Erreur à corriger ». Se tromper puis corriger aide à mémoriser."]
  ];
  return pageHead("Mon plan", "De A2 à C2 cette année", "")
    + '<section class="card"><h2>Ton objectif, honnêtement</h2><div class="prose" style="margin-top:10px">'
    + "<p>Les estimations de Cambridge en heures d'apprentissage guidé (cumulées) donnent un ordre de grandeur : A2 ≈ 200 h, B1 ≈ 400 h, B2 ≈ 600 h, C1 ≈ 800 h, C2 ≈ 1 000 à 1 200 h.</p>"
    + "<p>Il te reste <b>" + plural(w, "semaine") + "</b> avant fin juin. Depuis ton niveau actuel (" + L + "), atteindre le B2 demande environ <b>" + perDay(toB2) + " h par jour</b>, et le C2 environ <b>" + perDay(toC2) + " h par jour</b>, en plus de tes cours.</p>"
    + "<p>Conclusion : avec 45 à 60 minutes par jour, en plus des cours et d'un peu d'immersion, un <b>B2 solide en juin</b> est ambitieux mais réaliste. Le C1 est possible si tu ajoutes beaucoup d'anglais dans ta vie (séries, lectures, conversations). Le C2 se construit en général sur plusieurs années : tout le programme est quand même là pour que tu ailles aussi loin que possible.</p>"
    + "</div></section>"
    + '<section class="card"><h2>Réglages</h2><div class="kv" style="margin-top:14px">'
    + '<label for="set-level">Niveau de départ</label><select class="field" id="set-level" data-set="startLevel">' + LEVELS.map(l => '<option value="' + l + '"' + (l === s.startLevel ? " selected" : "") + ">" + l + " · " + LEVEL_INFO[l].name + "</option>").join("") + "</select>"
    + '<label for="set-goal">Objectif quotidien</label><select class="field" id="set-goal" data-set="goal">' + [[30, "30 XP · environ 15 min"], [60, "60 XP · environ 30 min"], [100, "100 XP · environ 45 min"], [150, "150 XP · environ 1 h"]].map(g => '<option value="' + g[0] + '"' + (g[0] === s.goal ? " selected" : "") + ">" + g[1] + "</option>").join("") + "</select>"
    + '<label for="set-rate" class="needs-audio">Vitesse de la voix</label><select class="field needs-audio" id="set-rate" data-set="rate">' + [[0.8, "Lente"], [0.9, "Un peu lente"], [1, "Normale"], [1.15, "Rapide"]].map(g => '<option value="' + g[0] + '"' + (g[0] === s.rate ? " selected" : "") + ">" + g[1] + "</option>").join("") + "</select>"
    + "</div></section>"
    + '<section class="card"><h2>Ta routine quotidienne</h2><div class="method" style="margin-top:14px">'
    + [["5 min", "Révisions", "Toutes les cartes du jour, en répondant de tête avant de retourner."], ["15 min", "Une leçon", "Lis, écoute les exemples à voix haute, fais les 6 exercices. Si la leçon renvoie à ton livre, fais aussi les exercices de l'unité."], ["10 min", "Pratique", "Une dictée, une phrase de prononciation ou un petit texte corrigé."], ["10 à 30 min", "Immersion", "Une série, une vidéo, un podcast ou un article en anglais, sur un sujet qui te plaît."]].map((r, i) => '<div class="m"><span class="n">' + (i + 1) + "</span><div><b>" + r[1] + ' <span class="muted small">· ' + r[0] + "</span></b><p>" + r[2] + "</p></div></div>").join("")
    + "</div></section>"
    + '<section class="card"><h2>Pourquoi ça marche</h2><div class="method" style="margin-top:14px">' + methods.map((m, i) => '<div class="m"><span class="n">' + (i + 1) + "</span><div><b>" + m[0] + "</b><p>" + m[1] + "</p></div></div>").join("") + "</div></section>"
    + '<section class="card"><h2>Avec ton livre <em style="font-style:italic">Essential Grammar in Use</em></h2><div class="prose" style="margin-top:10px"><p>Le livre couvre le A1 au B1 en 115 unités. Chaque leçon A2 et B1 de l\'appli indique les unités correspondantes. Fais d\'abord la leçon ici, puis lis la page de gauche de l\'unité et fais les exercices de la page de droite. Vérifie avec le corrigé (Key to Exercises, p. 283).</p><p>Si tu hésites sur ce qui te manque, fais le <b>Study guide</b> du livre (p. 271) : il t\'indique les unités à travailler. Au-delà du B1, l\'appli prend le relais avec les leçons B2, C1 et C2.</p></div></section>'
    + '<section class="card"><h2>L\'immersion selon ton niveau</h2><div class="method" style="margin-top:14px">'
    + [["A2 → B1", "Séries que tu connais déjà, en anglais avec sous-titres anglais. Vidéos courtes pour apprenants. Chansons avec les paroles."], ["B1 → B2", "Séries en VO sous-titres anglais, podcasts pour apprenants, articles courts sur tes centres d'intérêt, vidéos YouTube de créateurs anglophones."], ["B2 → C1", "Films sans sous-titres, actualités en anglais, romans jeunesse puis adultes, discussions en ligne ou échanges linguistiques."], ["C1 → C2", "Presse de qualité, essais, podcasts de débat, écriture régulière (journal, articles), conversations sur des sujets abstraits."]].map((r, i) => '<div class="m"><span class="n">' + (i + 1) + "</span><div><b>" + r[0] + "</b><p>" + r[1] + "</p></div></div>").join("")
    + "</div></section>"
    + '<section class="card"><h2>Ta sauvegarde</h2><p class="muted" id="sync-state" style="margin-top:8px">' + esc(SYNC_TEXT[Store.status]) + "</p>"
    + (STANDALONE ? '<p class="small" style="margin-top:8px">Sur ce site, chaque appareil garde sa propre progression. La <a href="' + CLAUDE_URL + '" target="_blank" rel="noopener">version Claude</a> enregistre la tienne sur ton compte et ajoute la correction de tes textes par Claude.</p>' : "")
    + '<p style="margin-top:10px">' + s.xp + " XP au total · " + plural(lessonsDone, "leçon") + " faite" + (lessonsDone > 1 ? "s" : "") + " · " + plural(Object.keys(s.vocab).length, "liste") + " de vocabulaire · " + plural(Object.keys(s.cards).length, "carte") + " en révision · record de " + plural(bestStreak(), "jour") + "</p>"
    + (resetAsk ? '<div class="confirm" style="margin-top:14px"><b>Tout effacer ?</b><span>XP, série, leçons, cartes et textes seront supprimés. C\'est définitif.</span><div class="row"><button class="btn" style="background:var(--bad)" data-act="resetDo">Oui, tout effacer</button><button class="btn ghost" data-act="resetCancel">Annuler</button></div></div>' : '<div class="row" style="margin-top:14px"><button class="btn ghost small" data-act="resetAsk">Recommencer à zéro</button></div>')
    + "</section>";
};

/* =========================================================================
   Events
   ========================================================================= */
const ACT = {
  say: el => Voice.say(el.dataset.text, el),
  sayAllEx: el => { const L = byId[current.param]; if (L) Voice.sayAll(L.examples.map(e => e.en), el); },
  sayAllWords: el => { const V = vById[current.param]; if (V) Voice.sayAll(V.words.map(w => w.en), el); },
  jump: el => { const t = document.getElementById(el.dataset.to); if (t) t.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); },
  openLevel: el => { openLevelPref = el.dataset.level; if (current.name === "parcours") { render(false); const d = document.getElementById("lvl-" + el.dataset.level); if (d) d.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); } },
  welcomeDone: () => { S().welcomed = true; Store.change(); render(false); },
  mcq: el => {
    if (!Run || Run.answered) return;
    const e = byId[Run.id].exercises[Run.i]; const k = +el.dataset.k; const ok = k === e.answer;
    $$("#exbox .opt").forEach(b => { b.disabled = true; const bk = +b.dataset.k; if (bk === e.answer) b.classList.add("ok"); else if (bk === k) b.classList.add("ko"); });
    exFeedback(ok);
  },
  pick: el => { if (!Run || Run.answered) return; const k = +el.dataset.k; if (!Run.picked.includes(k)) { Run.picked.push(k); orderUI(); } },
  unpickOne: el => { if (!Run || Run.answered) return; Run.picked.splice(+el.dataset.n, 1); orderUI(); },
  unpick: () => { if (!Run || Run.answered) return; Run.picked = []; orderUI(); },
  checkOrder: () => {
    if (!Run || Run.answered) return;
    const e = byId[Run.id].exercises[Run.i];
    if (Run.picked.length < Run.pool.length) { toast("Utilise tous les mots"); return; }
    const given = norm(Run.picked.map(k => Run.pool[k]).join(" "));
    const ok = [e.answer].concat(e.alt || []).some(a => norm(a) === given);
    const b = $("#built"); if (b) b.classList.add(ok ? "ok" : "ko");
    $$("#exbox .wchip").forEach(x => { x.disabled = true; });
    exFeedback(ok);
  },
  exNext: () => { if (!Run) return; Run.i++; Run.answered = false; renderEx(); const b = $("#exbox"); if (b) b.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "nearest" }); },
  retry: () => { startRun(current.param); Run.retake = true; renderEx(); const b = $("#exbox"); if (b) b.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" }); },
  revStart: () => revStart(),
  grade: el => revGrade(+el.dataset.q),
  learnSet: () => { const V = vById[current.param]; if (V) learnSet(V); },
  vquiz: () => { const V = vById[current.param]; if (V) vquizStart(V); },
  vqAns: el => vqAnswer(+el.dataset.k, el),
  vqNext: () => { if (!VQ) return; VQ.i++; VQ.answered = false; renderVQ(); },
  vqClose: () => { VQ = null; const b = $("#vqbox"); if (b) b.innerHTML = ""; },
  vfilter: el => { vocabFilter = el.dataset.level || null; render(false); },
  addRef: el => addRef(el.dataset.ref),
  setPractice: el => { PR.tab = el.dataset.tab; },
  ptab: el => { PR.tab = el.dataset.tab; $$(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === PR.tab))); renderPractice(); },
  dictPlay: el => { if (D) Voice.say(X.dictation[D.idx].en, el); },
  dictSlow: el => { if (D) Voice.say(X.dictation[D.idx].en, el, 0.7); },
  dictNext: () => dictNext(),
  pronPlay: el => { if (P) Voice.say(X.speaking[P.idx].en, el); },
  pronSlow: el => { if (P) Voice.say(X.speaking[P.idx].en, el, 0.7); },
  micToggle: () => micToggle(),
  pronNext: () => pronNext(),
  pronDone: () => { bump("p"); addXP(5); pronNext(); },
  wrOther: () => { const pool = poolFor(X.writing, W.level).filter(o => o.i !== W.idx); if (pool.length) { W.idx = pool[Math.floor(Math.random() * pool.length)].i; W.res = null; W.err = ""; renderPractice(); } },
  wrSend: () => wrSend(),
  wrStop: () => { if (W.ctl) W.ctl.abort(); },
  wrSelf: () => { const ta = $("#wr-text"); if (ta) W.text = ta.value; if (countWords(W.text) < 15) { toast("Écris au moins 15 mots"); return; } const it = X.writing[W.idx]; S().writing.unshift({ at: dayKey(), level: W.level, title: it.title, words: countWords(W.text), note: null }); bump("p"); addXP(15); renderPractice(); },
  qExample: el => { const box = $("#prbox"); const ex = box ? JSON.parse(box.dataset.ex || "[]") : []; Q.text = ex[+el.dataset.i] || ""; const ta = $("#q-text"); if (ta) { ta.value = Q.text; ta.focus(); } },
  qAsk: () => qAsk(),
  qStop: () => { if (Q.ctl) Q.ctl.abort(); },
  resetAsk: () => { resetAsk = true; render(false); },
  resetCancel: () => { resetAsk = false; render(false); },
  resetDo: () => { resetAsk = false; Store.s = Object.assign(blank(), { migrated: true, welcomed: true }); Run = null; Rev = null; VQ = null; Store.change(); render(true); toast("Progression remise à zéro"); }
};
const SETTERS = {
  startLevel: v => { if (LEVELS.includes(v)) { S().startLevel = v; Store.change(); render(false); } },
  goal: v => { S().goal = Math.max(10, +v || 60); Store.change(); updateHeader(); },
  rate: v => { S().rate = +v || 1; Store.change(); if (Voice.tts && Voice.tts.setRate) Voice.tts.setRate(S().rate).catch(() => {}); Voice.say("This is how fast I will speak."); },
  prLevel: v => { PR.level = v; D = null; P = null; W.idx = null; W.res = null; renderPractice(); }
};
const FORMS = {
  type: () => {
    if (!Run || Run.answered) return;
    const inp = $("#ex-input"); const v = inp ? inp.value : "";
    if (!v.trim()) { toast("Écris ta réponse"); return; }
    const e = byId[Run.id].exercises[Run.i];
    const ok = e.answer.some(a => norm(a) === norm(v));
    if (inp) { inp.classList.add(ok ? "ok" : "ko"); inp.disabled = true; }
    const btn = $("#exbox form button"); if (btn) btn.disabled = true;
    exFeedback(ok);
  },
  rev: () => revFlip(),
  dict: () => dictCheck()
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const f = ACT[el.dataset.act];
  if (f) f(el, e);
});
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const fn = FORMS[f.dataset.form]; if (fn) fn(f);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-set]");
  if (el && SETTERS[el.dataset.set]) SETTERS[el.dataset.set](el.value);
});
document.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "wr-text") { W.text = e.target.value; const c = $("#wr-count"); if (c) c.textContent = plural(countWords(W.text), "mot"); }
  else if (id === "q-text") Q.text = e.target.value;
  else if (id === "irr-search") filterIrr(e.target.value);
});
document.addEventListener("keydown", e => {
  if (current.name !== "revisions" || !Rev || Rev.done) return;
  const typing = e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (typing) return;
  if (!Rev.shown && (e.key === " " || e.key === "Enter")) { e.preventDefault(); revFlip(); }
  else if (Rev.shown && ["1", "2", "3"].includes(e.key)) { e.preventDefault(); revGrade(+e.key - 1); }
});
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { Store.pull(false); updateHeader(); } });

/* =========================================================================
   Start
   ========================================================================= */
Store.load();
buildNav();
route();
Voice.init();
Mic.init();
Coach.init();
if (STANDALONE) {
  if ("serviceWorker" in navigator && /^https:$|^http:$/.test(location.protocol)) {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => { /* offline mode unavailable */ }); });
  }
} else {
  Store.connect();
}
})();
</script>
</body>
</html>
